<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぽこのおうち</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ぽこのおうち">
<meta name="theme-color" content="#bfeccd">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#2a2238}
body{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;color:#2e2438;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;display:none;flex-direction:column}
.screen.on{display:flex}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font-family:inherit;cursor:pointer}
.ov{position:absolute;inset:0;display:none;z-index:20;background:rgba(30,20,45,.55);overflow-y:auto;padding:20px 16px}
.ov.on{display:flex;align-items:center;justify-content:center}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#3a2f45;color:#fff;font-size:14px;padding:7px 14px;border-radius:99px;opacity:0;transition:opacity .3s;z-index:30;white-space:nowrap}
.toast.on{opacity:1}
.fx{position:absolute;font-size:24px;pointer-events:none;animation:float 1.3s ease-out forwards;z-index:6}
@keyframes float{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-70px) scale(1.2)}}

/* ===== こども ===== */
#kid{background:#bfeccd}
.khead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;font-size:13px}
.khead b{font-size:18px;font-family:'DotGothic16',sans-serif;font-weight:400}
#kgenki{font-size:15px;color:#c0306a}
.kstat{display:flex;gap:8px;padding:0 14px;font-size:13px;align-items:center}
.kstat .bar{flex:1;height:10px;background:#fff;border:2px solid #3a2f45}
.kstat .bar i{display:block;height:100%;background:#ff8fb8;transition:width .5s}
.knext{padding:4px 14px 0;font-size:13px;color:#2f5a35}
.kscene{position:relative;margin:6px 12px 0;border:4px solid #3a2f45;box-shadow:4px 4px 0 #3a2f45}
#kcv{width:100%}
#kov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#kdecor span{position:absolute;font-size:16px;transform:translate(-50%,-50%)}
#kzz{position:absolute;left:58%;top:50%;font-size:20px;color:#2e2438;font-weight:900;text-shadow:-2px 0 #fff,2px 0 #fff,0 -2px #fff,0 2px #fff}
#kmsg{margin:10px 12px 0;min-height:2.9em;font-size:15px;background:#fff;border:3px solid #3a2f45;padding:6px 10px;line-height:1.4}
.kbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 12px 0}
.kbtns button{border:3px solid #3a2f45;background:#fff;border-radius:14px;padding:7px 2px;font-size:14px;font-weight:900;color:#2e2438;box-shadow:0 4px 0 #3a2f45;display:flex;flex-direction:column;align-items:center;gap:1px}
.kbtns button em{font-style:normal;font-size:22px;height:30px;display:flex;align-items:center}
.kbtns img.bi{width:30px;height:30px;image-rendering:pixelated}
.kbtns button:active{transform:translateY(3px);box-shadow:0 1px 0 #3a2f45}
#kid .foot{width:auto;margin:10px 12px}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.item{border:3px solid #ddd;background:#fff;padding:6px 2px;font-size:12px;text-align:center;line-height:1.3;color:#2e2438}
.item em{display:block;font-size:24px;font-style:normal}
.item.on{border-color:#ff6f9c;background:#fff0f6}
.item.dis{opacity:.6;background:#eee}
.place{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:3px solid #3a2f45;background:#fff;padding:10px;margin-top:8px;font-size:15px}
.place em{font-style:normal;font-size:26px}
.place small{display:block;font-size:13px;color:#5a4868}
.place:disabled{opacity:.7;background:#eee}
.tabs{display:flex;gap:4px;margin:6px 0}
.tabs button{flex:1;border:3px solid #3a2f45;background:#eee;padding:6px;font-size:13px}
.tabs button.on{background:#ffd84d}
.sel{font-size:22px;min-height:34px;margin:4px 0;text-align:center}
#fcv{width:100%;border:3px solid #3a2f45;margin:6px 0}
.empty{font-size:13px;color:#999;padding:16px 0}
img.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.item em img.pix{width:34px;height:34px}
.got img.pix{width:84px;height:84px}
.mapg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.mt{aspect-ratio:1;border:3px solid #3a2f45;background:#8fd17a;font-size:26px;border-radius:8px;box-shadow:0 3px 0 #3a2f45;background-image:radial-gradient(#6fb85f 20%,transparent 22%);background-size:10px 10px}
.mt.open{background:#fff8ec}
.mt.got{background:#ffe8a0;opacity:.75}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0}
.sq{position:relative;aspect-ratio:1;border:3px solid #3a2f45;border-radius:10px;background:#fff8ec;font-size:22px;display:flex;align-items:center;justify-content:center;padding:0;color:#3a2f45}
.sq .ic{filter:none}
.sq.seen{background:#e8e2ee}
.sq.start{background:#d6f0ff}.sq.goal{background:#ffe8a0}.sq.puzzle{background:#f0e4ff}.sq.short{background:#dff7d8}
.sq.tgt{opacity:1;box-shadow:0 0 0 3px #ff5f97;animation:hint .6s ease-in-out infinite}
.sq .no{position:absolute;left:3px;top:1px;font-size:11px;color:#6a5a78}
.sq img.me{width:80%;height:80%}
.mapg.p3{grid-template-columns:repeat(3,1fr)}
.mmsg{font-size:14px;color:#2e2438;min-height:2.4em}
.got{font-size:30px;letter-spacing:4px;margin:8px 0}
.foot{display:flex;justify-content:space-between;gap:6px;width:92%;max-width:360px;margin:12px auto 10px}
.foot button{font-size:13px;border:2px solid #3a2f45;background:#fff;border-radius:99px;padding:6px 12px;color:#2e2438}
.kcard,.acard{background:#fff;border:4px solid #3a2f45;box-shadow:6px 6px 0 #3a2f45;padding:20px;width:100%;max-width:360px;text-align:center}
.kcard h2,.acard h2{font-size:20px;margin-bottom:8px;font-family:'DotGothic16',sans-serif;font-weight:400}
.kcard p,.acard p{font-size:14px;color:#4a3d58;line-height:1.6;margin-bottom:12px}
.kcard input,.acard input{width:100%;font:inherit;font-size:20px;text-align:center;padding:10px;border:3px solid #3a2f45;outline:none}
.pbtn{display:block;width:100%;margin-top:14px;padding:12px;font-size:17px;border:3px solid #3a2f45;background:#ffd84d;box-shadow:0 4px 0 #3a2f45}
.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #3a2f45}
.pbtn.pink{background:#ff9cc2}
.pbtn.gray{background:#eee}



/* 縦長の画面では、キャラの画面を縦に大きくする */
#kid .kscene{flex:1 1 auto;min-height:0;display:flex}
#kid #kcv{width:100%;height:100%}
#kid .foot{padding-bottom:6px}

button:disabled{color:#2e2438}
.pbtn:disabled{opacity:.55}
img.ii{width:1.3em;height:1.3em;vertical-align:-.28em;image-rendering:pixelated;image-rendering:crisp-edges}
.item em img.ii{width:34px;height:34px}
.sel img.ii{width:34px;height:34px}
.got img.ii{width:44px;height:44px;margin:0 2px}
.place em img.ii{width:30px;height:30px}
.sq .ic{display:flex;width:66%;height:66%;align-items:center;justify-content:center}
.sq .ic img.ii{width:100%;height:100%}
.mt img.ii{width:66%;height:66%}
.fx img{width:30px;height:30px;image-rendering:pixelated}
.hint{animation:hint 1s ease-in-out infinite;border-color:#ff5f97!important;background:#fff0f6!important}
@keyframes hint{50%{transform:translateY(-4px)}}
</style>
</head>
<body>
<!-- ================= こども ================= -->
<div id="kid" class="screen on">
  <div class="khead"><div><b id="kname2"></b> <span id="kstage"></span></div><div id="kgenki"></div></div>
  <div class="kstat"><span>なかよし</span><div class="bar"><i id="kaff"></i></div><span id="kaffn"></span></div>
  <div class="knext" id="knext"></div>
  <div class="kscene"><canvas id="kcv" width="64" height="48"></canvas><div id="kov"><div id="kdecor"></div><div id="kzz"></div></div></div>
  <div id="kmsg"></div>
  <div class="kbtns" id="kbtns">
    <button data-k="explore"><em data-ic="explore"></em>探検</button>
    <button data-k="walk"><em data-ic="walk"></em>お散歩</button>
    <button data-k="fish"><em data-ic="fish"></em>釣り</button>
    <button data-k="cook"><em data-ic="cook"></em>料理</button>
    <button data-k="feed"><em data-ic="feed"></em>ごはん</button>
    <button data-k="pet"><em data-ic="pet"></em>なでる</button>
    <button data-k="sleep"><em data-ic="sleep"></em>寝る</button>
    <button id="kbag"><em data-ic="bag"></em>持ち物</button>
  </div>
  <div class="foot"><button id="ksnd">🔊 音あり</button><button id="kff" style="display:none">⏩ テスト</button><button id="kreset">最初から</button></div>
  <div class="ov" id="ksetup"><div class="kcard">
    <h2>🌱 ふしぎな種を拾った！</h2>
    <p>生まれてくる子に<br>名前をつけてください</p>
    <input id="kname" maxlength="6" placeholder="ぽこ">
    <button class="pbtn" id="kstart">育てる！</button>
  </div></div>
  <div class="ov" id="kmodal"><div class="kcard" id="kmbody"></div></div>
  <div class="ov" id="kconfirm"><div class="kcard"><h2>最初からやり直す？</h2><p>今の子とはお別れになります</p>
    <button class="pbtn" id="kcy">最初から</button><button class="pbtn gray" id="kcn">やめる</button></div></div>
  <div class="toast" id="ktoast"></div>
</div>


<script>
// ================= 共通 =================
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
function toast(id,m){const t=$(id);t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1900)}
function fx(box,e,n=1,top=40){for(let i=0;i<n;i++){const d=document.createElement('div');d.className='fx';d.textContent=e;
  d.style.left=(32+Math.random()*30)+'%';d.style.top=(top+Math.random()*14)+'%';d.style.animationDelay=(i*.12)+'s';box.appendChild(d);setTimeout(()=>d.remove(),1700+i*120)}}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));}
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>show('menu'));
const hourOf=skew=>new Date(Date.now()+skew).getHours();

// ===== ぽこ ドット絵スプライト（左半分を書いて左右反転） =====
const SPR=(()=>{
  const K='#3a2f45';
  const mk=(half,pal,face,opt={})=>{
    const rows=half.map(r=>{const right=r.split('').reverse().join('');return r+(opt.keepW?right:right.replace(/W/g,'B'))});
    return {rows,pal:{K,...pal},w:rows[0].length,h:rows.length,face};
  };
  return {
  seed: mk([
    "....KK","...KBB","..KBWB","..KBBB",".KBbBB",".KBBBB","KBbBBB","KBBBBB","KBbBBB",".KBBBB",".KbBBB","..KbbB","...KKK"],
    {B:'#c08a50',b:'#9a6a3a',W:'#e8c08a'}, null),
  baby: mk([
    "....GG.","....GGG","......G","...KKKK","..KKBBB",".KBWBBB",".KBBBBB","KBBBBBB","KBBBBBB","KbBBBBB",".KbbBBB","..KKKKK"],
    {B:'#fff1d6',b:'#ecd3ae',W:'#ffffff',G:'#5bb85b'},
    {ew:1,eyes:[[4,6],[9,6]],mouth:[6,9],blush:[[3,8],[10,8]],nose:[6,8],quirk:'hair'}),
  child: mk([
    "..gGG....","...gGG...",".....GGGG","........G","....KKKKK","..KKBBBBB",".KBWWBBBB",".KBWBBBBB","KBBBBBBBB","KBBBBBBBB","KBBBBBBBB","KBBBBBBBB","KbBBBBBBB",".KbbBBBBB","..KKKKKKK","...KbbK.."],
    {B:'#fff1d6',b:'#ecd3ae',W:'#ffffff',G:'#5bb85b',g:'#3f9a45'},
    {ew:1,eyes:[[5,9],[12,9]],mouth:[8,13],blush:[[3,11],[14,11]],nose:[8,11],quirk:'hanamizu'}),
  umi: mk([
    ".........K","........KB",".......KBB","......KBBB",".....KBBBB","....KBWBBB","...KBWBBBB","..KBBBBBBB","..KBBBBBBB",".KBBBBBBBB",".KBBBBBBBB",".KBBBBBBBB","FKBBBBBBBB","FFKBBBBBBB",".FKbBBBBBB","..KbbBBBBB","...KbbbBBB","....KKKKKK","......KSK.","......KSK.","......KSK.",".....KOOK."],
    {S:'#f6d2b8',O:'#e0405a',B:'#8fd0ff',b:'#5fb0e8',W:'#e6f6ff',F:'#4a90d0'},
    {ew:2,eyes:[[3,10],[15,10]],mouth:[9,14],blush:[[3,13],[15,13]],quirk:'lips'}),
  mori: mk([
    "......KKKK","....KKRRRR","...KRRWWRR","..KRRWWRRR",".KRRRRRRRW",".KRRRRRRWW","KRRWWRRRRR","KRRWWRRRRR","KKKKKKKKKK","..KBBBBBBB","..KBBBBBBB",".KBBBBBBBB",".KBBBBBBBB","KBKBBBBBBB","KBKBBBBBBB",".K.KbBBBBB","...KbbBBBB","....KKKKKK","......KSK.","......KSK.","......KSK.",".....KOOK."],
    {S:'#f6d2b8',O:'#e0405a',R:'#e05a5a',W:'#fff4e0',B:'#f3e3c3',b:'#d9c29a'},
    {ew:2,eyes:[[5,11],[13,11]],mouth:[9,15],blush:[[3,14],[15,14]],nose:[9,13],quirk:'kuma_hige'},{keepW:true}),
  hana: mk([
    "........PP",".....PP.PP","....PPPPYY","....PPPPYY",".....PP.PP","........GG","....KKKKKK","..KKBBBBBB",".KBWBBBBBB",".KBBBBBBBB","KBBBBBBBBB","KBBBBBBBBB","KBBBBBBBBB","LKBBBBBBBB",".LKbBBBBBB","..KbBBBBBB","...KbbBBBB","....KKKKKK","......KSK.","......KSK.","......KSK.",".....KOOK."],
    {S:'#f6d2b8',O:'#e0405a',P:'#ff8fb8',Y:'#ffd84d',G:'#5bb85b',B:'#ffd3e2',b:'#f5b0c8',W:'#ffffff',L:'#5bb85b'},
    {ew:2,eyes:[[5,10],[13,10]],mouth:[9,14],blush:[[3,12],[15,12]],nose:[9,12],quirk:'matsuge'}),
  okashi: mk([
    ".........R","........RR",".....KKKKK","...KKWWWWW","..KWWWWWWW",".KWWWWWWWW",".KWWWWWWWW","KWWBWWWBWW","KBBBBWBBBB","KBBBBBBBBB","KBBBBBBBBB","KBBBBBBBBB","KBBBBBBBBB","KKKKKKKKKK",".KCcCcCcCc",".KCcCcCcCc","..KCcCcCcC","...KKKKKKK","......KSK.","......KSK.","......KSK.",".....KOOK."],
    {S:'#f6d2b8',O:'#e0405a',R:'#e0405a',W:'#fffaf0',B:'#ffd36b',b:'#e8b04a',C:'#ff9cc2',c:'#ffc4dc'},
    {ew:2,eyes:[[5,9],[13,9]],mouth:[9,11],blush:[[3,11],[15,11]],quirk:'deppa'},{keepW:true}),
  };
})();
// ctx に (ox,oy) から描く。expr: normal/happy/sleep/sad/eat
function drawSprite(g,s,ox,oy,expr='normal',blush=true){
  s.rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const c=r[x];if(c!=='.'){g.fillStyle=s.pal[c];g.fillRect(ox+x,oy+y,1,1)}}});
  const f=s.face; if(!f) return;
  const P=(x,y,c)=>{g.fillStyle=c;g.fillRect(ox+x,oy+y,1,1)};
  const E='#2a2238', mid=s.w/2;
  if(blush) f.blush.forEach(([x,y])=>{P(x,y,'#ff9db0');if(f.ew===2)P(x+1,y,'#ff9db0')});
  // 目：ふだんは、たれたじと目
  f.eyes.forEach(([x,y])=>{
    const left=x<mid, w=f.ew;
    if(expr==='happy'){ if(w===2){P(x-1,y+1,E);P(x,y,E);P(x+1,y,E);P(x+2,y+1,E)} else {P(x-1,y+1,E);P(x,y,E);P(x+1,y+1,E)} }
    else if(expr==='sleep'){ for(let i=-1;i<=w;i++)P(x+i,y+1,E); if(w===2)P(left?x-1:x+2,y+2,E) }
    else if(expr==='sad'){ P(x,y+1,E); if(w===2){P(x+1,y+1,E);P(left?x+1:x,y-1,E);P(left?x+2:x-1,y-2,E)} }
    else { // じと目
      if(w===2){ for(let i=-1;i<=2;i++)P(x+i,y,E); P(left?x-1:x+2,y+1,E); P(x,y+1,E);P(x+1,y+1,E); P(left?x+1:x,y+1,'#ffffff') }
      else { P(x-1,y,E);P(x,y,E);P(x+1,y,E);P(x,y+1,E); P(left?x-1:x+1,y+1,E) }
    }
  });
  const q=f.quirk||'';
  if(q.includes('kuma')) f.eyes.forEach(([x,y])=>{P(x,y+2,'#a58ac8');P(x+1,y+2,'#a58ac8')});
  if(q.includes('matsuge')&&expr!=='sleep') f.eyes.forEach(([x,y])=>{const l=x<mid;P(l?x-2:x+3,y-1,E);P(l?x-1:x+2,y-1,E);P(x,y-1,E)});
  if(f.nose){const [nx,ny]=f.nose;P(nx,ny,'#e8707a');if(f.ew===2||s.w%2===0)P(nx+1,ny,'#e8707a')}
  // 口
  const [mx,my]=f.mouth, two=f.ew===2||s.w%2===0;
  if(q==='lips'){
    const L='#ff6f8f';
    if(expr==='eat'){g.fillStyle=L;g.fillRect(ox+mx-1,oy+my-1,4,4);g.fillStyle='#8a2040';g.fillRect(ox+mx,oy+my,2,2)}
    else if(expr==='sleep'){g.fillStyle=L;g.fillRect(ox+mx-1,oy+my,4,2);P(mx+3,my+2,'#bfe8ff')}
    else {g.fillStyle=L;g.fillRect(ox+mx-1,oy+my,4,2);P(mx-1,my,E);P(mx+2,my,E);g.fillStyle=E;g.fillRect(ox+mx,oy+my+1,2,1); if(expr==='happy'){P(mx-2,my-1,L);P(mx+3,my-1,L)}}
  } else if(expr==='eat'){g.fillStyle='#c0505a';g.fillRect(ox+mx,oy+my,2,2)}
  else if(expr==='happy'){P(mx-1,my,E);P(mx,my+1,E);P(mx+1,my+1,E);P(mx+2,my,E);P(mx+3,my-1,E)}
  else if(expr==='sad'){P(mx-1,my+1,E);P(mx,my,E);P(mx+1,my,E);P(mx+2,my+1,E)}
  else if(expr==='sleep'){P(mx,my,E);P(mx+1,my,E);P(mx+1,my+1,'#bfe8ff');P(mx+1,my+2,'#bfe8ff')}
  else { P(mx-1,my,E); if(two)P(mx,my,E); P(mx+(two?1:0),my,E); P(mx+(two?2:1),my-1,E) } // への字ぎみの口
  if(q==='deppa'&&expr!=='sleep'&&expr!=='eat'){P(mx,my+1,'#ffffff');P(mx+1,my+1,'#ffffff');P(mx,my+2,E);P(mx+1,my+2,E)}
  if(q.includes('hige')){const c='#5a3a32';[-2,-1,2,3].forEach(d=>P(mx+d,my-1,c));P(mx-3,my,c);P(mx+4,my,c)}
  if(q==='hair'){P(Math.floor(mid),-1,E);P(Math.floor(mid)+1,-2,E);P(Math.floor(mid),-3,E)}
  if(q==='hanamizu'&&expr!=='happy'){P(f.nose[0],f.nose[1]+1,'#9fd8ff');P(f.nose[0],f.nose[1]+2,'#9fd8ff')}
}

// ===== 料理のドット絵（12x12） =====
const DISH_SPR={
  juice:{p:{G:'#e8f4ff',R:'#e0405a',r:'#ff8a9a',S:'#ffd84d',W:'#ffffff'},r:[

const dishPix=(()=>{const cache={};return k=>{
  if(cache[k])return cache[k];const d=DISH_SPR[k];if(!d)return '';
  const c=document.createElement('canvas');c.width=12;c.height=12;const g=c.getContext('2d');
  d.r.forEach((row,y)=>{for(let x=0;x<12;x++){const ch=row[x];if(ch&&ch!=='.'){g.fillStyle=ch==='K'?'#3a2f45':d.p[ch];g.fillRect(x,y,1,1)}}});
  return cache[k]=c.toDataURL();
}})();

// ===== 音（BGM・鳴き声・効果音）すべてその場で合成 =====
const SND=(()=>{
  let ac=null, master=null, on=true, cur=null, timer=null, step=0;
  try{ on=localStorage.getItem('poko_snd')!=='0' }catch(e){}
  function ctx(){
    if(!ac){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      ac=new AC(); master=ac.createGain(); master.gain.value=0.22; master.connect(ac.destination); }
    if(ac.state==='suspended') ac.resume();
    return ac;
  }
  const hz=n=>261.63*Math.pow(2,n/12); // 0 = ド(C4)
  function tone(f,d,type='square',v=0.12,t0=0,slide=0){
    if(!on) return; const a=ctx(); if(!a||a.state!=='running') return;
    const o=a.createOscillator(), gn=a.createGain(), t=a.currentTime+t0;
    o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.linearRampToValueAtTime(Math.max(40,f+slide),t+d);
    gn.gain.setValueAtTime(v,t); gn.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(gn); gn.connect(master); o.start(t); o.stop(t+d+0.03);
  }
  // ---- BGM ----
  const _=null;
  const SONGS={
    home:{bpm:100,wave:'square',v:.05,
      mel:[0,4,7,4, 9,7,4,_, 2,4,7,9, 7,_,4,_, 0,4,7,12, 9,7,4,2, 4,2,0,2, 0,_,_,_],
      bass:[-12,_,-5,_, -12,_,-5,_, -10,_,-3,_, -8,_,-5,_, -12,_,-5,_, -7,_,-3,_, -10,_,-5,_, -12,_,-5,_]},
    night:{bpm:72,wave:'triangle',v:.06,
      mel:[12,_,7,_, 9,_,4,_, 7,_,_,_, 4,_,_,_, 5,_,4,_, 2,_,0,_, 2,_,_,_, _,_,_,_],
      bass:[-12,_,_,_, -15,_,_,_, -17,_,_,_, -12,_,_,_, -19,_,_,_, -17,_,_,_, -12,_,_,_, _,_,_,_]},
    mori:{bpm:112,wave:'triangle',v:.07,
      mel:[7,9,12,_, 9,7,4,_, 7,_,9,7, 4,2,0,_, 2,4,7,_, 4,7,9,_, 12,_,9,7, 9,_,_,_],
      bass:[-12,_,-8,_, -5,_,-8,_, -10,_,-7,_, -3,_,-7,_, -12,_,-8,_, -5,_,-8,_, -7,_,-10,_, -12,_,_,_]},
    umi:{bpm:96,wave:'sine',v:.08,
      mel:[12,_,11,9, 7,_,9,_, 4,_,7,_, 9,_,_,_, 12,_,14,12, 11,_,9,_, 7,_,4,_, 7,_,_,_],
      bass:[-12,-5,0,-5, -12,-5,0,-5, -15,-8,-3,-8, -15,-8,-3,-8, -17,-10,-5,-10, -17,-10,-5,-10, -12,-5,0,-5, -12,_,_,_]},
    yama:{bpm:120,wave:'square',v:.045,
      mel:[0,_,0,4, 7,_,7,_, 5,4,2,_, 7,_,_,_, 0,_,0,4, 7,_,12,_, 11,9,7,5, 4,_,_,_],
      bass:[-12,_,-5,_, -12,_,-5,_, -14,_,-7,_, -17,_,-10,_, -12,_,-5,_, -12,_,-5,_, -10,_,-17,_, -12,_,_,_]},
  };
  function bgm(name){
    if(name===cur) return; cur=name; clearInterval(timer); timer=null; step=0;
    if(!name||!SONGS[name]) return;
    const s=SONGS[name], dur=60/s.bpm/2;
    timer=setInterval(()=>{
      if(!on||!ac||ac.state!=='running') return;
      const m=s.mel[step%s.mel.length], b=s.bass[step%s.bass.length];
      if(m!==null) tone(hz(m),dur*0.9,s.wave,s.v);
      if(b!==null) tone(hz(b),dur*0.8,'triangle',s.v*1.3);
      step++;
    },dur*1000);
  }
  // ---- 鳴き声（姿ごとにちがう） ----
  function cry(k){
    if(k==='baby'){ tone(1200,.08,'square',.1,0,300); tone(1300,.08,'square',.1,.11,300); }
    else if(k==='child'){ tone(820,.09,'square',.1,0,80); tone(600,.12,'square',.1,.11,-60); }       // ぽこっ
    else if(k==='umi'){ [0,.07,.14].forEach((t,i)=>tone(420+i*120,.06,'sine',.16,t,350)); }          // ぷくぷく
    else if(k==='mori'){ tone(260,.18,'triangle',.2,0,-70); tone(200,.16,'triangle',.18,.17,-40); }  // もふぅ
    else if(k==='hana'){ tone(880,.16,'sine',.15,0,520); }                                            // ぴゅい
    else if(k==='okashi'){ tone(700,.07,'square',.09,0,0); tone(1050,.12,'square',.09,.08,120); }      // ぷりん
  }
  const sfx={
    pick(){ tone(988,.06,'square',.08); tone(1319,.12,'square',.08,.06); },
    ding(){ [0,4,7,12].forEach((n,i)=>tone(hz(n+12),.12,'triangle',.12,i*.07)); },
    eat(){ [0,.12,.24].forEach(t=>tone(180,.06,'square',.08,t,-60)); },
    bite(){ tone(1500,.08,'square',.1); tone(1500,.08,'square',.1,.12); },
    splash(){ tone(300,.25,'sawtooth',.06,0,600); },
    miss(){ tone(400,.2,'triangle',.1,0,-200); },
    fanfare(){ [0,4,7,12,7,12].forEach((n,i)=>tone(hz(n+12),.14,'square',.08,i*.1)); },
    pop(){ tone(600,.05,'sine',.12,0,400); },
    btn(){ tone(1100,.03,'square',.04); },
  };
  // 最初のタップで音を有効にする（ブラウザの決まり）
  // スマホは「指を離した時」「クリック」でないと音の許可が出ないので、そこで鳴らせる状態にする
  let unlocked=false;
  const unlock=()=>{
    const a=ctx(); if(!a) return;
    if(a.state!=='running') a.resume();
    if(!unlocked){ try{ const b=a.createBuffer(1,1,22050), src=a.createBufferSource(); src.buffer=b; src.connect(a.destination); src.start(0); unlocked=true; }catch(e){} }
  };
  ['touchend','click','pointerup','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
  return { bgm, cry, sfx,
    get on(){return on},
    toggle(){ on=!on; try{localStorage.setItem('poko_snd',on?'1':'0')}catch(e){} if(on) ctx(); return on; } };
})();

      if(ok){const k=wpick([['sakana',60],['oosakana',15],['kutsu',15],['takara',10]]);
        if(k==='takara'){add(S.decor,'takara');add(S.inv,'hoshi');txt='🎁 宝箱！ 中に⭐星のかけらが入っていた！'}
        else{IT[k].d?add(S.decor,k):add(S.inv,k);txt=k==='kutsu'?'👢 長ぐつ… 飾りにしちゃおう':`${IT[k].e} ${IT[k].n}が釣れた！`}
        if(k!=='kutsu'){S.lucky=true;txt+='　🍀次の探検はラッキー'}
        kfx($('kmbody'),'💦',2,20);SND.sfx.splash()} else SND.sfx.miss();
      if(S.fishN>=3){S.fishN=0;S.fishRest=now()+10*MIN;txt+='\n{n}は疲れちゃった（10分休憩）';$('fbtn').disabled=true}
      $('fmsg').innerHTML=pixify(esc(txt.replaceAll('{n}',S.name))); $('fbtn').textContent='もう一回'; save();
    };
    $('fbtn').onclick=()=>{if(F.ph==='wait')done(false,'早すぎ！ 逃げられた…');else if(F.ph==='bite')done(true);else start()};
    $('fend').onclick=close;
    start(); fishTimer=setInterval(drawF,60);
  }

  // ---- すごろく探検 ----
  const SQ={start:{e:'🏠',n:'スタート'},short:{e:'⏩',n:'近道'},treasure:{e:'🎁',n:'宝箱'},event:{e:'❓',n:'イベント'},puzzle:{e:'🃏',n:'パズル'},goal:{e:'🏁',n:'ゴール'}};
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function makeMap(p){
    const mid=[];for(let i=0;i<7;i++)mid.push({t:'item',k:wpick(p.t)});
    mid.push({t:'short'},{t:'short'},{t:'treasure'},{t:'puzzle'},{t:'puzzle'},{t:'event'},{t:'event'});
    return {sq:[{t:'start'}].concat(shuffle(mid),[{t:'goal'}]),pos:0,rolls:6,done:false,seen:[0]};
  }
  const sqIcon=q=>q.t==='item'?IT[q.k].e:SQ[q.t].e;
  let charImg=null;
  function charPic(){const sp=SPR[ckey()]||SPR.baby,c=document.createElement('canvas');c.width=sp.w+2;c.height=sp.h+2;drawSprite(c.getContext('2d'),sp,1,1,'happy');return c.toDataURL()}
  function mapUI(){
    const E=S.explore; if(!E.map||!E.map.sq) E.map=makeMap(PLACES[E.p]);
    const M=E.map, order=[0,1,2,3,7,6,5,4,8,9,10,11,15,14,13,12];
    let target=null, busyM=false, msg='サイコロを振ってね'; charImg=charPic();
    function render(){
      const left=Math.max(0,Math.ceil((E.end-now())/MIN));
      modal(`<h2>🎲 ${PLACES[E.p].n}すごろく</h2><p>サイコロ残り <b>${M.rolls}</b>回　帰りまで あと${left}分</p>
        <div class="board">${order.map(i=>{const q=M.sq[i];const here=i===M.pos;
          return `<button class="sq ${M.seen.includes(i)?'seen':''} ${i===target?'tgt':''} ${q.t}" data-i="${i}" ${i===target&&!busyM?'':'disabled'}>
            <span class="no">${i===0?'':i}</span>${here?`<img class="pix me" src="${charImg}">`:`<span class="ic">${sqIcon(q)}</span>`}</button>`}).join('')}</div>
        <p class="mmsg">${msg}</p>
        ${M.done?'':`<button class="pbtn" id="roll" ${target!==null||busyM||M.rolls<=0?'disabled':''}>🎲 サイコロを振る</button>`}
        <button class="pbtn gray" onclick="K.close()">とじる</button>`);
      const r=$('roll'); if(r) r.onclick=roll;
      $('kmbody').querySelectorAll('.sq.tgt').forEach(b=>b.onclick=()=>move(+b.dataset.i));
    }
    function roll(){
      if(M.rolls<=0||busyM)return; busyM=true; let n=0, face=1;
      const iv=setInterval(()=>{face=1+Math.floor(Math.random()*3);msg=`🎲 ${'⚀⚁⚂'[face-1]}`;render();SND.sfx.btn();
        if(++n>6){clearInterval(iv);M.rolls--;busyM=false;target=Math.min(15,M.pos+face);msg=`${face}が出た！ 光っているマスをタップ`;save();render()}},90);
    }
    function move(to){
      busyM=true; target=null;
      const iv=setInterval(()=>{ if(M.pos<to){M.pos++;SND.sfx.pop();render()} else {clearInterval(iv);busyM=false;land()} },220);
    }
    function land(){
      const q=M.sq[M.pos]; if(!M.seen.includes(M.pos))M.seen.push(M.pos);
      if(q.t==='item'){E.bonus.push(q.k);msg=`${IT[q.k].e}${IT[q.k].n}を拾った！`;SND.sfx.pick();SND.cry(ckey())}
      else if(q.t==='short'){E.end=Math.max(now()+5000,E.end-2*MIN);msg='⏩ 近道！ 帰りが2分早くなった';SND.sfx.ding()}
      else if(q.t==='treasure'){const r=pick(['hoshi','hoshi','ishi','takara']);E.bonus.push(r);msg=`🎁 宝箱！ ${IT[r].e}${IT[r].n}が入っていた！`;SND.sfx.fanfare()}
      else if(q.t==='event'){
        const ev=pick(['jump','friend','nothing','friend','jump']);
        if(ev==='jump'&&M.pos<15){msg='❓ 追い風！ 2マス進む';save();render();setTimeout(()=>move(Math.min(15,M.pos+2)),700);return}
        if(ev==='friend'){addAff(2);msg=`❓ ${pick(['うさぎ','りす','たぬき','ことり'])}に会った！ なかよし+2`;SND.cry(ckey())}
        else msg='❓ どんぐりを踏んだ… 何もなかった';
      }
      else if(q.t==='puzzle'){save();return puzzle()}
      else if(q.t==='goal'){const a=wpick(PLACES[E.p].t),b2=wpick(PLACES[E.p].t);E.bonus.push(a,b2);E.end=now()+4000;M.done=true;msg=`🏁 ゴール！ ${IT[a].e}${IT[b2].e}をもらった！ {n}がもうすぐ帰ってくるよ`.replace('{n}',S.name);SND.sfx.fanfare()}
      if(!M.done&&M.rolls<=0){M.done=true;msg+='<br>サイコロがなくなった。続きは次の探検で！'}
      save(); render();
    }
    // パズルマス：3ペアの神経衰弱（4回まで）
    function puzzle(){
      const ks=[...new Set(PLACES[E.p].t.map(x=>x[0]))].slice(0,3), cards=shuffle(ks.concat(ks)); let open=[],got=[],tries=4,lock=false;
      function pr(m){
        modal(`<h2>🃏 パズルマス</h2><p>同じ物をそろえよう　のこり <b>${tries}</b>回</p>
          <div class="mapg p3">${cards.map((k,i)=>`<button class="mt ${open.includes(i)||got.includes(i)?'open':''} ${got.includes(i)?'got':''}" data-i="${i}">${open.includes(i)||got.includes(i)?IT[k].e:''}</button>`).join('')}</div>
          <p class="mmsg">${m||'カードをめくってね'}</p>`);
        $('kmbody').querySelectorAll('.mt').forEach(b=>b.onclick=()=>flip(+b.dataset.i));
      }
      function finish(){const n=got.length/2;for(let i=0;i<got.length;i+=2)E.bonus.push(cards[got[i]]);
        msg=n?`🃏 パズルで${n}個そろえた！ ${got.filter((_,i)=>i%2===0).map(i=>IT[cards[i]].e).join('')}をゲット`:'🃏 パズル失敗… ざんねん';
        if(!M.done&&M.rolls<=0){M.done=true;msg+='<br>サイコロがなくなった'}save();setTimeout(render,900)}
      function flip(i){
        if(lock||open.includes(i)||got.includes(i)||tries<=0)return; SND.sfx.btn(); open.push(i); pr();
        if(open.length<2)return; tries--; const [a,b2]=open;
        if(cards[a]===cards[b2]){got.push(a,b2);open=[];SND.sfx.pick();pr('そろった！');if(got.length===6||tries<=0)finish()}
        else{lock=true;setTimeout(()=>{open=[];lock=false;pr('ちがった…');if(tries<=0)finish()},700)}
      }
      pr();
    }
    render();
  }
  // ---- もちもの ----
  function bagUI(tab='food'){
    if(!S||S.stage==='seed')return;
    let body='';
    if(tab==='food'){const a=Object.keys(S.inv),b=Object.keys(S.dishes);
      body=(a.length?`<p>材料</p><div class="items">${a.map(k=>`<div class="item"><em>${IT[k].e}</em>${IT[k].n}<br>×${S.inv[k]}</div>`).join('')}</div>`:'')+
        (b.length?`<p>料理</p><div class="items">${b.map(k=>`<div class="item"><em><img class="pix" src="${dishPix(k)}"></em>${DISH[k].n}<br>×${S.dishes[k]}</div>`).join('')}</div>`:'')||'<div class="empty">何も持っていません</div>'}
    if(tab==='decor'){const d=Object.keys(S.decor);body=d.length?`<p>タップで「飾る／しまう」を切り替えられます</p><div class="items">${d.map(k=>{const off=(S.hideDecor||{})[k];return `<button class="item ${off?'dis':'on'}" data-dec="${k}"><em>${IT[k].e}</em>${IT[k].n}<br>${off?'しまってある':'飾ってる'}</button>`}).join('')}</div>`:'<div class="empty">まだありません。探検で見つけよう</div>'}
    if(tab==='recipe'){body=`<p>見つけたレシピ ${S.recipes.filter(k=>k!=='fushigi').length} / ${Object.keys(R).length}</p><div class="items">${Object.entries(R).map(([key,d])=>{const has=S.recipes.includes(d.k);const hint=IT[key.split('+')[0]].e;
      return `<div class="item ${has?'':'dis'}"><em>${has?`<img class="pix" src="${dishPix(d.k)}">`:'❓'}</em>${has?d.n:hint+' ＋ ？'}</div>`}).join('')}</div>`}
    modal(`<h2>🎒 持ち物</h2><div class="tabs"><button data-t="food" class="${tab==='food'?'on':''}">食べ物</button><button data-t="decor" class="${tab==='decor'?'on':''}">飾り</button><button data-t="recipe" class="${tab==='recipe'?'on':''}">レシピ</button></div>${body}<button class="pbtn gray" onclick="K.close()">とじる</button>`);
    $('kmbody').querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>bagUI(b.dataset.t));
    $('kmbody').querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const k=b.dataset.dec;S.hideDecor=S.hideDecor||{};S.hideDecor[k]=!S.hideDecor[k];save();SND.sfx.btn();bagUI('decor')});
  }

  // ---- イベント ----
  document.querySelectorAll('#kbtns button[data-k]').forEach(b=>b.onclick=()=>{SND.sfx.btn();act(b.dataset.k)});
  const sndLabel=()=>$('ksnd').innerHTML=pixify(SND.on?'🔊 音あり':'🔇 音なし'); sndLabel();
  $('ksnd').onclick=()=>{SND.toggle();sndLabel()};
  $('kbag').onclick=()=>bagUI();
  cv.onclick=(e)=>{
    if(!S)return;
    if(S.explore){exTap(e);return}
    if(S.stage==='seed'){S.taps++;
      if(S.taps>=5){let n=0;const iv=setInterval(()=>{g.fillStyle=n%2?'#fff':'#bfe8a0';g.fillRect(0,0,64,48);if(++n>6){clearInterval(iv);
        S.stage='baby';S.last=now();S.inv={kinomi:2};save();ui();draw();kfx($('kov'),'🎉',3,30);SND.sfx.fanfare();
        say('種から{n}が生まれた！');setTut(1)}},120)}
      else {SND.sfx.pop();} if(S.taps<5) say(['ぴくっ…','動いた！','芽が出た！','もう少し…！'][S.taps-1]);save();draw();return}
    if(!present()||S.sleep)return;
    busy='happy';say(`「${voice()}」`);setTimeout(()=>busy=null,900);SND.cry(ckey());
  };
  $('kstart').onclick=()=>{const t=Date.now();
    S={name:$('kname').value.trim()||'ぽこ',stage:'seed',taps:0,form:null,genki:3,aff:0,inv:{},dishes:{},decor:{},recipes:[],tags:{},
       explore:null,sleep:false,lucky:false,justBack:false,last:t,skew:0};
    $('ksetup').classList.remove('on');save();ui();draw();say('種をタップして、芽を出させよう')};
  $('kff').onclick=()=>{if(!S||S.stage==='seed'){ktoast('先に種を育ててね');return}const st=S.explore?3:30;S.skew+=st*MIN;tick();save();ui();draw();ktoast(st+'分たった！')};
  $('kreset').onclick=()=>$('kconfirm').classList.add('on');
  $('kcn').onclick=()=>$('kconfirm').classList.remove('on');
  $('kcy').onclick=()=>{store.set(KEY,null);S=null;$('kconfirm').classList.remove('on');$('ksetup').classList.add('on');draw()};
  function open(){show('kid');S=store.get(KEY);
    if(!S){$('ksetup').classList.add('on')}
    else{tick();save();ui();if(!$('kmodal').classList.contains('on'))say(S.stage==='seed'?'種をタップして、芽を出させよう':S.explore?'{n}は探検中…':'おかえり！ {n}が待ってたよ')}
    draw()}
  setInterval(()=>{if(!$('kid').classList.contains('on'))return;frame++;
    if(S&&present()&&!S.sleep&&!busy&&Math.random()<.18){const nx=x+(Math.random()<.5?-1:1);if(nx>=24&&nx<=44){face=nx>x?1:-1;x=nx}}
    if(S&&S.explore&&!$('kmodal').classList.contains('on'))exStep();
    SND.bgm(!S||S.stage==='seed'?'home':S.explore?S.explore.p:(S.sleep||per()==='night')?'night':'home');
    if(S&&frame%25===0){tick();save()}
    if(frame%2===0)ui();draw()},200);
  return {open,close};
})();


document.querySelectorAll('.kcard h2').forEach(h=>h.innerHTML=pixify(h.innerHTML));
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=`<img class="pix bi" src="${ICON(e.dataset.ic)}">`);
if(location.search.includes('debug'))$('kff').style.display='';
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
K.open();
</script>
